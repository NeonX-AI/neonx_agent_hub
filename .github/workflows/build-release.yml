name: Build Windows Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release from this build
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Increment hub patch version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $path = "config/versions.env"
          $content = Get-Content -LiteralPath $path
          $line = $content | Where-Object { $_ -match '^NEONX_HUB_VERSION=' }
          if (-not $line -or $line -notmatch '^NEONX_HUB_VERSION=(\d+)\.(\d+)\.(\d+)$') { throw "Invalid NEONX_HUB_VERSION" }
          $next = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
          $content = $content -replace '^NEONX_HUB_VERSION=.*$', "NEONX_HUB_VERSION=$next"
          Set-Content -LiteralPath $path -Value $content -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/versions.env
          git commit -m "chore: bump hub version to $next [skip ci]"
          git push

      - name: Build Windows executable
        shell: pwsh
        run: .\platforms\windows\build.ps1

      - name: Package Windows release ZIP
        shell: pwsh
        run: |
          $version = (Get-Content config/versions.env | Where-Object { $_ -match '^NEONX_HUB_VERSION=' }) -replace '^NEONX_HUB_VERSION=', ''
          $package = "dist/windows/NeonX-Agent-Hub-windows-v$version.zip"
          Compress-Archive -Path dist/windows/NeonX-Agent-Hub.exe -DestinationPath $package -CompressionLevel Optimal
          Write-Host "Created $package"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonX-Agent-Hub-windows
          path: dist/windows/NeonX-Agent-Hub-windows-v*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/windows/NeonX-Agent-Hub-windows-v*.zip
          generate_release_notes: true
          prerelease: false
